name: Deploy game to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: ${{ hashFiles('package.json') != '' }}
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: ${{ hashFiles('package-lock.json') != '' && 'npm' || '' }}

      - name: Build game
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f package.json ]]; then
            if [[ -f package-lock.json ]]; then npm ci; else npm install; fi
            if node -e "const p=require('./package.json'); process.exit(p.scripts?.build ? 0 : 1)"; then
              if node -e "const p=require('./package.json'); const d={...p.dependencies,...p.devDependencies}; process.exit(d.vite ? 0 : 1)"; then
                npm run build -- --base=/valhem/
              else
                npm run build
              fi
            fi
          fi

      - name: Prepare Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          if [[ -d dist ]]; then
            cp -a dist _site
          elif [[ -d build ]]; then
            cp -a build _site
          elif [[ -d public && -f public/index.html ]]; then
            cp -a public _site
          else
            mkdir _site
            rsync -a ./ _site/ \
              --exclude .git/ \
              --exclude .github/ \
              --exclude node_modules/ \
              --exclude _site/
          fi
          touch _site/.nojekyll
          test -f _site/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
